show:
  title: "The Half-Life Morning Show"
  host_name: "Adam"            # name the AI host uses for itself
  listener_name: "Atomic"           # optional: "Good morning, <name>"
  description: "A personal daily news briefing, compiled locally."
  author: "AtomicDoc"
  # Public base URL where the `public/` folder is served (your Cloudflare Tunnel hostname, e.g. https://podcast.yourdomain.com).
  # Podcast apps need absolute URLs, so set this before subscribing.
  base_url: "https://podcast.atmc.lol"
  target_minutes: 20          # rough episode length
  max_stories: 10             # cap per episode (new + follow-ups)
  interests: >
    Technology, AI, science, world news, US politics, economy, gaming, Esports (League of Legends), Deadlock.
    Skip celebrity gossip and traditional sports scores; esports results are welcome.
  polish_pass: true           # second "read it aloud" editing pass per story: more natural, ~2x writing time

ollama:
  url: "http://localhost:11434"
  # gemma3:12b writes the most natural English that runs here; it slightly overflows the 4060's 8GB into
  # system RAM, which is slower but fine for a 5:30am job. Faster/plainer: llama3.1:8b (fits fully in VRAM).
  # Also worth trying: qwen3:14b or qwen3:30b-a3b (set `think: false` below for both).
  chat_model: "gemma3:12b"
  embed_model: "nomic-embed-text"
  num_ctx: 12288
  temperature: 0.75           # a bit higher = less formulaic phrasing
  timeout_seconds: 900
  # think: false              # uncomment for qwen3 / other reasoning models

memory:
  max_article_age_hours: 36   # ignore older items when fetching
  story_window_days: 14       # how far back to look for "same story" matches
  same_story_auto: 0.86       # cosine similarity: above this = same story, no LLM check
  same_story_maybe: 0.72      # between maybe..auto the LLM decides; below = new story

tts:
  engine: "chatterbox"        # chatterbox (most natural) | kokoro (fast) | piper
  # Run `python -m newsfeed voices` to hear every option side by side before choosing.
  # Chatterbox uses its built-in voice, or clones any clean 10-20s WAV you point it at
  # (use your own recording or one you have rights to, e.g. a public-domain LibriVox reader).
  chatterbox_voice: ""
  chatterbox_exaggeration: 0.7   # "lively" (picked from voice tests); 0.35 calm, 0.5 natural
  chatterbox_cfg_weight: 0.3     # lower (~0.3) = slower, more deliberate pacing
  kokoro_voice: "af_heart"    # female: af_heart (best), af_bella, af_nicole, bf_emma (British)
  kokoro_speed: 1.0
  piper_model: ""             # path to a .onnx voice if engine = piper
  intro_audio: ""             # optional mp3/wav played before the episode
  outro_audio: ""

paths:
  data_dir: "data"            # SQLite DB lives here
  public_dir: "public"        # served over HTTP: feeds + episodes
  keep_episodes: 30
