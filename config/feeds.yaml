# News sources. Add/remove freely — any RSS or Atom URL works.
# `weight` (optional, default 1.0) is how much each article counts when ranking stories for the editor.
# A story's score is the sum of its articles' weights, so big stories covered everywhere rank high
# naturally; boost niche sources (e.g. Deadlock) so their single-source stories still get considered.
feeds:
  # --- World / US news ---
  - name: NPR News
    url: https://feeds.npr.org/1001/rss.xml
  - name: NPR World
    url: https://feeds.npr.org/1004/rss.xml
  - name: NPR Politics
    url: https://feeds.npr.org/1014/rss.xml
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
  - name: AP (via Google News)
    url: https://news.google.com/rss/search?q=site:apnews.com&hl=en-US&gl=US&ceid=US:en
  - name: Reuters (via Google News)
    url: https://news.google.com/rss/search?q=site:reuters.com&hl=en-US&gl=US&ceid=US:en
  - name: Politico
    url: https://rss.politico.com/politics-news.xml

  # --- Economy ---
  - name: NPR Economy
    url: https://feeds.npr.org/1017/rss.xml
  - name: CNBC Economy
    url: https://www.cnbc.com/id/20910258/device/rss/rss.html
  - name: MarketWatch
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories

  # --- Technology & AI ---
  - name: NPR Technology
    url: https://feeds.npr.org/1019/rss.xml
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
  - name: TechCrunch
    url: https://techcrunch.com/feed/
  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
  - name: The Decoder (AI)
    url: https://the-decoder.com/feed/
    weight: 1.3
  - name: Hacker News (front page)
    url: https://hnrss.org/frontpage
    weight: 0.6

  # --- Science ---
  - name: NPR Science
    url: https://feeds.npr.org/1007/rss.xml
  - name: Quanta Magazine
    url: https://www.quantamagazine.org/feed/
  - name: New Scientist
    url: https://www.newscientist.com/feed/home/
  - name: NASA
    url: https://www.nasa.gov/news-release/feed/

  # --- Gaming ---
  - name: PC Gamer
    url: https://www.pcgamer.com/rss/
  - name: GamesIndustry.biz
    url: https://www.gamesindustry.biz/feed
  - name: Polygon
    url: https://www.polygon.com/rss/index.xml

  # --- Esports ---
  - name: Esports Insider
    url: https://esportsinsider.com/feed
    weight: 1.3
  - name: Dexerto
    url: https://www.dexerto.com/feed/

  # --- Deadlock (boosted so patches/news aren't crowded out by world news) ---
  - name: Deadlock (Steam news)
    url: https://store.steampowered.com/feeds/news/app/1422450/
    weight: 3.0
  - name: Deadlock (Google News)
    url: https://news.google.com/rss/search?q=%22Deadlock%22+Valve&hl=en-US&gl=US&ceid=US:en
    weight: 2.0
  - name: r/DeadlockTheGame (top today)
    url: https://www.reddit.com/r/DeadlockTheGame/top/.rss?t=day
    weight: 1.0
